# Local development stack. The prototype runs without this (SQLite + in-process
# Redis fallback); bring it up when you want the PRD's real data layer.
#
#   docker compose up -d mysql redis
#   # then set DATABASE_PROVIDER=mysql and DATABASE_URL / REDIS_URL in .env
#   npm run db:push && npm run db:seed

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-storage-engine=InnoDB
      # Tablespace encryption (PRD: encryption at rest).
      - --innodb-redo-log-encrypt=ON
      - --innodb-undo-log-encrypt=ON
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: luckcays
      MYSQL_USER: luckcays
      MYSQL_PASSWORD: luckcays
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_PROVIDER: mysql
      DATABASE_URL: mysql://luckcays:luckcays@mysql:3306/luckcays
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:5173
    env_file:
      - .env
    ports:
      - "4000:4000"
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    environment:
      VITE_API_BASE: http://localhost:4000
    ports:
      - "5173:5173"
    profiles: ["full"]

volumes:
  mysql-data:
  redis-data:
